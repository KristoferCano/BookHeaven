# Fly.io configuration for BookHeaven Backend
# Deploy with: flyctl deploy

app = "bookheaven"
primary_region = "ams"

[build]
  dockerfile = "./backend/Dockerfile"
  
[env]
  APP_NAME = "BookHeaven"
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://bookheaven.fly.dev"
  
  DB_CONNECTION = "pgsql"
  DB_PORT = "5432"
  
  MAIL_MAILER = "smtp"
  MAIL_HOST = "smtp.gmail.com"
  MAIL_PORT = "587"
  MAIL_FROM_ADDRESS = "zcripta@gmail.com"
  MAIL_FROM_NAME = "BookHeaven"
  MAIL_ENCRYPTION = "tls"
  
  QUEUE_CONNECTION = "database"
  SESSION_DRIVER = "database"
  CACHE_STORE = "file"
  LOG_LEVEL = "info"
  PHP_CLI_SERVER_WORKERS = "4"

[[services]]
  protocol = "tcp"
  internal_port = 80
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 100

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[statics]]
  guest_path = "/var/www/html/public/storage"
  url_prefix = "/storage"
