version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: bookheaven_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bookheaven}
      POSTGRES_USER: ${DB_USERNAME:-bookheaven}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - bookheaven_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bookheaven}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookheaven_backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: ${APP_NAME:-BookHeaven}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bookheaven}
      DB_USERNAME: ${DB_USERNAME:-bookheaven}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      
      SANCTUM_STATEFUL_DOMAINS: localhost,127.0.0.1,${APP_DOMAIN:-localhost:3000}
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
      - backend_bootstrap:/var/www/html/bootstrap/cache
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookheaven_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Frontend (optional, for local development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookheaven_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - bookheaven_network
    environment:
      VITE_API_URL: http://backend:8000/api
      BACKEND_URL: http://backend:8000

volumes:
  db_data:
    driver: local
  backend_storage:
    driver: local
  backend_bootstrap:
    driver: local

networks:
  bookheaven_network:
    driver: bridge
