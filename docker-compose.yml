version: '3.8'

services:
  # MySQL Database (Local Development)
  db:
    image: mysql:8.0
    container_name: bookheaven_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bookheaven2}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-bookheaven}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - bookheaven_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookheaven_backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: BookHeaven
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:8oM+Dw3kiVIdy2aulUQ3vENzUEJvxjalKExx39HqYDw=}
      APP_DEBUG: "true"
      APP_URL: http://localhost:9000
      
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-bookheaven2}
      DB_USERNAME: ${DB_USERNAME:-bookheaven}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-zcripta@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-sgcm dkkj zxsz vqbu}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-zcripta@gmail.com}
      MAIL_FROM_NAME: BookHeaven
      MAIL_ENCRYPTION: tls
      
      FRONTEND_URL: http://localhost:5173
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:5174,localhost:5175
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
      - backend_bootstrap:/var/www/html/bootstrap/cache
    ports:
      - "9000:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookheaven_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookheaven_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bookheaven_network
    environment:
      VITE_API_URL: http://localhost:9000

volumes:
  db_data:
    driver: local
  backend_storage:
    driver: local
  backend_bootstrap:
    driver: local

networks:
  bookheaven_network:
    driver: bridge

    driver: local

networks:
  bookheaven_network:
    driver: bridge
