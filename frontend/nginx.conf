# Nginx Configuration para BookHeaven Frontend
# Este archivo optimiza la entrega del frontend con compresión y caché

server {
    listen 80;
    server_name _;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript;
    gzip_comp_level 6;

    # Directorio raíz del frontend (coincide con Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    # Evitar acceso a archivos sensibles
    location ~ /\. {
        deny all;
    }

    location ~ /node_modules/ {
        deny all;
    }

    # Assets estáticos con caché largo (hash en nombre = cambios = nuevo archivo)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Assets sin hash - revisar frecuentemente
    location ~* \.(html|json|manifest|webmanifest)$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600";
        access_log off;
    }

    # SPA fallback - toda ruta que no exista va a index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300";
    }

    # Headers de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
