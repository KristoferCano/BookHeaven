# Global optimizations para Nginx
# Estas directivas van en el bloque http{}

# ================================
# PERFORMANCE BASICS
# ================================
sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;

# ================================
# BUFFER SIZES
# ================================
client_body_buffer_size 10M;
client_max_body_size 10M;
client_header_buffer_size 1k;

# ================================
# TIMEOUTS
# ================================
client_body_timeout 12;
client_header_timeout 12;
send_timeout 10;

# ================================
# GZIP COMPRESSION
# ================================
gzip on;
gzip_vary on;
gzip_min_length 1000;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss;
