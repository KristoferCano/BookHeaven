# OPTIMIZACIÓN: Configuración global de Nginx
# NOTA: Las directivas location están en default_server.conf

# ================================
# GLOBAL OPTIMIZATIONS
# ================================

# Optimizaciones de performance
sendfile on;
tcp_nopush on;
tcp_nodelay on;

# Timeouts
client_body_timeout 12;
client_header_timeout 12;
keepalive_timeout 15;
send_timeout 10;

# Buffer sizes
client_body_buffer_size 128k;
client_max_body_size 10m;
client_header_buffer_size 1k;

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1000;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
}

# ================================
# STATIC FILES OPTIMIZATION
# ================================

location ~* \.(ico|txt)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000";
    access_log off;
}

# ================================
# PERFORMANCE HEADERS
# ================================

# HTTP/2 Push (opcional, si soporta)
add_header Link "</js/vendor-[hash].js>; rel=preload; as=script" always;

# Headers de seguridad (sin impacto en rendimiento)
add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy "strict-origin-when-cross-origin";

# ================================
# COMPRESSION NEGOTIATION
# ================================

# Servir .gz si el cliente soporta gzip
location ~ ^(.+)\.gz$ {
    add_header Content-Type "application/gzip";
    add_header Content-Encoding "gzip";
    add_header Vary "Accept-Encoding";
    rewrite ^(.+)\.gz$ $1 break;
}

# Servir .br si el cliente soporta brotli
location ~ ^(.+)\.br$ {
    add_header Content-Type "application/brotli";
    add_header Content-Encoding "br";
    add_header Vary "Accept-Encoding";
    rewrite ^(.+)\.br$ $1 break;
}

# ================================
# PERFORMANCE TUNING
# ================================

# Keep-alive connections
keepalive_timeout 65;
keepalive_requests 100;

# TCP Optimization
tcp_nopush on;
tcp_nodelay on;

# Buffer optimization
# (client_max_body_size is already defined in nginx-main.conf as 100M)

# Disable unnecessary logging de static files
map $request_uri $loggable {
    ~*\.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|eot|ttf|otf|ico)$ 0;
    default 1;
}

access_log /var/log/nginx/access.log if=$loggable;

# ================================
# UPSTREAM OPTIMIZATION
# ================================

# Upstream backend con balanceo (si tienes múltiples servidores)
upstream backend_server {
    server localhost:8000 max_fails=3 fail_timeout=30s;
    # server 192.168.1.100:8000 backup;
    keepalive 32;
}

# ================================
# REQUEST OPTIMIZATION
# ================================

# Disable request body size para imágenes grandes
client_body_buffer_size 10M;

# Timeouts optimizados
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 10s;
